{% extends "base.html" %}
{% block content %}
    {% load crispy_forms_tags %}
    <h1> Delate car</h1>
    <div class="alert alert-warning" role="alert">
        <strong>Warning!</strong> You are about to <b>delete</b> this car. This action cannot be undone.
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-danger">
            Delate
        </button>
    </form>
{% endblock %}
